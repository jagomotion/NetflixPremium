<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet"
  />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #08080a;
      --surface: #101013;
      --surface-2: #17171b;
      --border: #232328;
      --text: #f4f4f5;
      --muted: #85858e;
      --accent: #e50914;
      --accent-soft: rgba(229, 9, 20, 0.14);
    }
    html,
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(
          circle at 20% 10%,
          rgba(229, 9, 20, 0.1),
          transparent 40%
        ),
        radial-gradient(circle at 80% 90%, rgba(229, 9, 20, 0.06), transparent 45%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: overlay;
    }
    .material-symbols-rounded {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      font-size: 20px;
      line-height: 1;
      user-select: none;
    }

    /* ===== INTRO SPLASH ===== */
    .splash {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: splashOut 0.6s ease 1.6s forwards;
    }
    .splash-logo {
      font-family: "Inter", sans-serif;
      font-weight: 800;
      font-size: clamp(3rem, 12vw, 6rem);
      letter-spacing: -0.06em;
      color: var(--accent);
      opacity: 0;
      transform: scale(0.85);
      animation: logoIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
      text-shadow: 0 0 40px rgba(229, 9, 20, 0.6),
        0 0 90px rgba(229, 9, 20, 0.3);
      position: relative;
    }
    .splash-logo::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -14px;
      width: 0;
      height: 2px;
      background: var(--accent);
      transform: translateX(-50%);
      animation: lineGrow 1s ease 0.7s forwards;
    }
    @keyframes logoIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes lineGrow {
      to {
        width: 60%;
      }
    }
    @keyframes splashOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 620px;
      margin: 0 auto;
      padding: 56px 22px 40px;
    }

    /* ===== HEADER ===== */
    header {
      text-align: center;
      margin-bottom: 44px;
      animation: slideDown 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.9s backwards;
    }
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .brand .word {
      color: var(--text);
    }
    .brand .word--accent {
      color: var(--accent);
      position: relative;
    }
    .brand .word--accent::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -6px;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--accent),
        transparent
      );
      animation: beam 2.4s ease-in-out infinite;
    }
    @keyframes beam {
      0%,
      100% {
        opacity: 0.4;
        transform: scaleX(0.6);
      }
      50% {
        opacity: 1;
        transform: scaleX(1);
      }
    }
    .subtitle {
      margin-top: 14px;
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .subtitle .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      box-shadow: 0 0 8px #22c55e;
      animation: pulseDot 1.8s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.4;
      }
    }

    /* ===== BUTTON ===== */
    .btn-wrap {
      position: relative;
      animation: slideDown 0.7s cubic-bezier(0.16, 1, 0.3, 1) 2.05s backwards;
    }
    .btn-generate {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px 20px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      overflow: hidden;
      isolation: isolate;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.25s ease;
      box-shadow: 0 8px 24px -8px rgba(229, 9, 20, 0.6);
    }
    .btn-generate::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        180px circle at var(--mx, 50%) var(--my, 50%),
        rgba(255, 255, 255, 0.22),
        transparent 65%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }
    .btn-generate:hover::before {
      opacity: 1;
    }
    .btn-generate:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 32px -8px rgba(229, 9, 20, 0.7);
    }
    .btn-generate:active:not(:disabled) {
      transform: translateY(0) scale(0.995);
    }
    .btn-generate:disabled {
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-generate .material-symbols-rounded {
      font-size: 18px;
    }
    .btn-generate .shine {
      position: absolute;
      top: 0;
      left: -80%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        100deg,
        transparent,
        rgba(255, 255, 255, 0.28),
        transparent
      );
      transform: skewX(-20deg);
      animation: shine 3.6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shine {
      0% {
        left: -80%;
      }
      55% {
        left: 120%;
      }
      100% {
        left: 120%;
      }
    }

    /* ===== LOADER ===== */
    .loader {
      display: none;
      margin-top: 26px;
      animation: fadeIn 0.3s ease;
    }
    .loader.active {
      display: block;
    }
    .loader-bar {
      height: 3px;
      width: 100%;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .loader-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 40%;
      background: linear-gradient(
        90deg,
        transparent,
        var(--accent),
        transparent
      );
      animation: slide 1.3s ease-in-out infinite;
    }
    @keyframes slide {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(350%);
      }
    }
    .loader-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .loader-status .step {
      color: var(--text);
    }
    .loader-status .cursor {
      display: inline-block;
      width: 7px;
      height: 12px;
      background: var(--accent);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 0.9s steps(1) infinite;
    }
    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* ===== ERROR ===== */
    .error {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: #fca5a5;
      background: rgba(229, 9, 20, 0.08);
      border: 1px solid rgba(229, 9, 20, 0.3);
      border-radius: 10px;
      animation: shakeIn 0.4s ease;
    }
    .error.active {
      display: flex;
    }
    .error .material-symbols-rounded {
      font-size: 16px;
      flex-shrink: 0;
    }
    @keyframes shakeIn {
      0% {
        transform: translateX(0);
      }
      25% {
        transform: translateX(-6px);
      }
      50% {
        transform: translateX(5px);
      }
      75% {
        transform: translateX(-3px);
      }
      100% {
        transform: translateX(0);
      }
    }

    /* ===== SKELETON ===== */
    .skeleton {
      display: none;
      margin-top: 26px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
    }
    .skeleton.active {
      display: block;
    }
    .sk-row {
      height: 12px;
      background: linear-gradient(
        90deg,
        var(--surface-2) 0%,
        #1e1e23 40%,
        var(--surface-2) 80%
      );
      background-size: 200% 100%;
      border-radius: 6px;
      margin-bottom: 14px;
      animation: shimmer 1.4s linear infinite;
    }
    .sk-row:nth-child(1) {
      width: 45%;
    }
    .sk-row:nth-child(2) {
      width: 100%;
    }
    .sk-row:nth-child(3) {
      width: 78%;
    }
    .sk-row:nth-child(4) {
      width: 60%;
    }
    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    /* ===== CARD ===== */
    .card {
      display: none;
      position: relative;
      margin-top: 26px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
    }
    .card.active {
      display: block;
    }
    .card .bracket {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid var(--accent);
      opacity: 0.55;
      pointer-events: none;
    }
    .card .bracket.tl {
      top: -1px;
      left: -1px;
      border-right: none;
      border-bottom: none;
      border-top-left-radius: 14px;
    }
    .card .bracket.tr {
      top: -1px;
      right: -1px;
      border-left: none;
      border-bottom: none;
      border-top-right-radius: 14px;
    }
    .card .bracket.bl {
      bottom: -1px;
      left: -1px;
      border-right: none;
      border-top: none;
      border-bottom-left-radius: 14px;
    }
    .card .bracket.br {
      bottom: -1px;
      right: -1px;
      border-left: none;
      border-top: none;
      border-bottom-right-radius: 14px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 11px 0;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
      opacity: 0;
      transform: translateY(6px);
    }
    .card.active .row {
      animation: rowIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .card.active .row:nth-child(1) { animation-delay: 0.05s; }
    .card.active .row:nth-child(2) { animation-delay: 0.1s; }
    .card.active .row:nth-child(3) { animation-delay: 0.15s; }
    .card.active .row:nth-child(4) { animation-delay: 0.2s; }
    .card.active .row:nth-child(5) { animation-delay: 0.25s; }
    @keyframes rowIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .row:last-of-type {
      border-bottom: none;
    }
    .row .label {
      color: var(--muted);
      font-weight: 400;
      flex-shrink: 0;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .row .value {
      color: var(--text);
      font-weight: 500;
      text-align: right;
      word-break: break-word;
      overflow-wrap: anywhere;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-family: "Inter", sans-serif;
    }
    .badge .material-symbols-rounded {
      font-size: 13px;
    }
    .badge.ok {
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
    }
    .badge.fail {
      background: var(--accent-soft);
      color: #f87171;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 24px 0 10px;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0;
      transform: translateY(6px);
    }
    .card.active .section-title {
      animation: rowIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .card.active .section-title:nth-of-type(1) { animation-delay: 0.3s; }
    .card.active .section-title:nth-of-type(2) { animation-delay: 0.4s; }
    .section-title .material-symbols-rounded {
      font-size: 13px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 9px;
      text-decoration: none;
      transition: border-color 0.22s ease, background 0.22s ease,
        transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translateY(6px);
    }
    .card.active .link-btn {
      animation: rowIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .card.active .link-btn:nth-child(1) { animation-delay: 0.36s; }
    .card.active .link-btn:nth-child(2) { animation-delay: 0.42s; }
    .card.active .link-btn:nth-child(3) { animation-delay: 0.48s; }
    .link-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }
    .link-btn .material-symbols-rounded {
      font-size: 15px;
      color: var(--muted);
    }
    .link-btn:hover .material-symbols-rounded {
      color: var(--accent);
    }

    .token {
      position: relative;
      background: #0b0b0e;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px;
      opacity: 0;
      transform: translateY(6px);
    }
    .card.active .token {
      animation: rowIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }
    .token textarea {
      width: 100%;
      min-height: 70px;
      background: transparent;
      border: none;
      outline: none;
      resize: vertical;
      color: var(--text);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      line-height: 1.55;
      letter-spacing: 0.01em;
    }
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text);
      background: #17171b;
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease,
        transform 0.15s ease;
    }
    .copy-btn:hover {
      background: #1d1d22;
      border-color: #303038;
    }
    .copy-btn:active {
      transform: scale(0.97);
    }
    .copy-btn.copied {
      border-color: rgba(34, 197, 94, 0.5);
      color: #4ade80;
    }
    .copy-btn .material-symbols-rounded {
      font-size: 13px;
    }

    footer {
      margin-top: 56px;
      text-align: center;
      font-size: 0.74rem;
      color: var(--muted);
      opacity: 0;
      animation: fadeIn 0.8s ease 2.5s forwards;
    }
    footer .by {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    footer .signature {
      font-family: "Caveat", cursive;
      font-size: 1.35rem;
      color: var(--text);
      font-weight: 600;
      letter-spacing: 0.01em;
      background: linear-gradient(
        90deg,
        var(--text) 0%,
        #f4f4f5 40%,
        var(--accent) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="splash-logo">NETFLIX</div>
  </div>

  <div class="container">
    <header>
      <div class="brand">
        <span class="word">Netflix</span>
        <span class="word word--accent">Premium</span>
      </div>
    </header>

    <div class="btn-wrap">
      <button id="btnGenerate" class="btn-generate">
        <span class="shine"></span>
        <span class="material-symbols-rounded">bolt</span>
        <span id="btnLabel">Generate Account</span>
      </button>
    </div>

    <div class="loader" id="loader">
      <div class="loader-bar"></div>
      <div class="loader-status">
        <span class="step" id="stepText">Connecting<span class="cursor"></span></span>
        <span id="stepTimer">0.0s</span>
      </div>
    </div>

    <div class="error" id="errorMsg">
      <span class="material-symbols-rounded">error</span>
      <span id="errorText">Something went wrong.</span>
    </div>

    <div class="skeleton" id="skeleton">
      <div class="sk-row"></div>
      <div class="sk-row"></div>
      <div class="sk-row"></div>
      <div class="sk-row"></div>
    </div>

    <div class="card" id="card">
      <span class="bracket tl"></span>
      <span class="bracket tr"></span>
      <span class="bracket bl"></span>
      <span class="bracket br"></span>

      <div class="row">
        <span class="label">Status</span>
        <span id="badge" class="badge"></span>
      </div>
      <div class="row">
        <span class="label">Account ID</span>
        <span id="accId" class="value">-</span>
      </div>
      <div class="row">
        <span class="label">Expiry</span>
        <span id="accExpiry" class="value">-</span>
      </div>
      <div class="row">
        <span class="label">Plan</span>
        <span id="accPlan" class="value">-</span>
      </div>
      <div class="row">
        <span class="label">Country</span>
        <span id="accCountry" class="value">-</span>
      </div>

      <div class="section-title">
        <span class="material-symbols-rounded">link</span>
        <span>Login Links</span>
      </div>
      <div class="links" id="links"></div>

      <div class="section-title">
        <span class="material-symbols-rounded">key</span>
        <span>Access Token</span>
      </div>
      <div class="token">
        <textarea id="tokenText" readonly></textarea>
        <button class="copy-btn" id="copyBtn">
          <span class="material-symbols-rounded">content_copy</span>
          <span id="copyLabel">Copy</span>
        </button>
      </div>
    </div>

    <footer>
      <span class="by">
        Crafted by <span class="signature">Zack Rylsen</span>
      </span>
    </footer>
  </div>

  <script>
    const btn = document.getElementById("btnGenerate");
    const btnLabel = document.getElementById("btnLabel");
    const loader = document.getElementById("loader");
    const stepText = document.getElementById("stepText");
    const stepTimer = document.getElementById("stepTimer");
    const errorBox = document.getElementById("errorMsg");
    const errorText = document.getElementById("errorText");
    const skeleton = document.getElementById("skeleton");
    const card = document.getElementById("card");

    const meta = {
      pc: { label: "PC", icon: "computer" },
      android: { label: "Android", icon: "smartphone" },
      tv: { label: "TV", icon: "tv" },
    };

    const steps = [
      "Connecting",
      "Requesting token",
      "Parsing response",
      "Rendering",
    ];

    let stepInterval = null;
    let timerInterval = null;

    function setLoading(state) {
      btn.disabled = state;
      loader.classList.toggle("active", state);
      skeleton.classList.toggle("active", state);
      btnLabel.textContent = state ? "Processing..." : "Generate Account";

      if (state) {
        let i = 0;
        const start = Date.now();
        stepText.innerHTML =
          steps[0] + '<span class="cursor"></span>';
        stepTimer.textContent = "0.0s";

        stepInterval = setInterval(() => {
          i = (i + 1) % steps.length;
          stepText.innerHTML = steps[i] + '<span class="cursor"></span>';
        }, 1200);

        timerInterval = setInterval(() => {
          const s = ((Date.now() - start) / 1000).toFixed(1);
          stepTimer.textContent = s + "s";
        }, 100);
      } else {
        clearInterval(stepInterval);
        clearInterval(timerInterval);
        stepText.innerHTML = "";
      }
    }

    function showError(message) {
      errorText.textContent = message;
      errorBox.classList.add("active");
    }

    function clearError() {
      errorBox.classList.remove("active");
    }

    function renderBadge(success) {
      const badge = document.getElementById("badge");
      badge.className = "badge " + (success ? "ok" : "fail");
      badge.innerHTML =
        '<span class="material-symbols-rounded">' +
        (success ? "check_circle" : "cancel") +
        "</span>" +
        (success ? "Success" : "Failed");
    }

    function renderLinks(links) {
      const container = document.getElementById("links");
      container.innerHTML = "";
      Object.entries(links || {}).forEach(([key, url]) => {
        const info = meta[key] || { label: key, icon: "public" };
        const a = document.createElement("a");
        a.className = "link-btn";
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.innerHTML =
          '<span class="material-symbols-rounded">' +
          info.icon +
          "</span><span>" +
          info.label +
          "</span>";
        container.appendChild(a);
      });
    }

    function renderResult(r) {
      renderBadge(!!r.success);
      document.getElementById("accId").textContent = r.id || "-";
      document.getElementById("accExpiry").textContent = r.expiry || "-";
      document.getElementById("accPlan").textContent =
        r.profile?.plan || "Unknown";
      document.getElementById("accCountry").textContent =
        r.profile?.country || "Unknown";
      document.getElementById("tokenText").value = r.token || "";
      renderLinks(r.links);
    }

    btn.addEventListener("mousemove", (e) => {
      const rect = btn.getBoundingClientRect();
      btn.style.setProperty("--mx", e.clientX - rect.left + "px");
      btn.style.setProperty("--my", e.clientY - rect.top + "px");
    });

    btn.addEventListener("click", async () => {
      clearError();
      card.classList.remove("active");
      setLoading(true);

      try {
        const res = await fetch("/api/generate", { method: "POST" });
        const data = await res.json();

        if (!data.status || !data.result) {
          throw new Error(data.message || "Failed to generate account.");
        }

        setLoading(false);
        renderResult(data.result);
        requestAnimationFrame(() => card.classList.add("active"));
      } catch (err) {
        setLoading(false);
        showError(err.message);
      }
    });

    document.getElementById("copyBtn").addEventListener("click", async () => {
      const ta = document.getElementById("tokenText");
      const copyBtn = document.getElementById("copyBtn");
      const label = document.getElementById("copyLabel");
      try {
        await navigator.clipboard.writeText(ta.value);
        copyBtn.classList.add("copied");
        label.textContent = "Copied";
        setTimeout(() => {
          copyBtn.classList.remove("copied");
          label.textContent = "Copy";
        }, 1500);
      } catch {
        ta.select();
        document.execCommand("copy");
      }
    });
  </script>
</body>
</html>
